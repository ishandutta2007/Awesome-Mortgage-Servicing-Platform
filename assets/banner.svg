<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes waveMove1{0%{transform:translateX(0)}50%{transform:translateX(-60px) translateY(5px)}}@keyframes waveMove2{0%{transform:translateX(0)}50%{transform:translateX(40px) translateY(-8px)}}@keyframes pulseNode{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}@keyframes lineFlow{0%{stroke-dashoffset:400}}.wave1{animation:waveMove1 12s ease-in-out infinite;opacity:.25}.wave2{animation:waveMove2 9s ease-in-out infinite;opacity:.35}.pulse-dot{animation:pulseNode 3s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:20,10;animation:lineFlow 15s linear infinite}.banner-subtitle,.banner-tag,.banner-title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-title{font-weight:800;font-size:46px;fill:url(#text-grad);letter-spacing:-.5px}.banner-subtitle{font-weight:500;font-size:19px;fill:#e2e8f0;letter-spacing:.2px}.banner-tag{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}</style><rect width="1200" height="300" fill="url(#bg-grad)" rx="12"/><rect width="1200" height="300" fill="url(#grid)" rx="12"/><g class="wave1"><path fill="#6366f1" d="M-100 220 Q 200 120 500 240 T 1100 180 T 1400 260 L 1400 300 L -100 300 Z"/></g><g class="wave2"><path fill="#0284c7" d="M-100 260 Q 300 180 700 250 T 1300 200 L 1300 300 L -100 300 Z"/></g><path fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="2.5" d="M 50 230 C 250 150, 450 260, 650 170 C 850 80, 1050 210, 1150 140" class="flow-line"/><circle cx="650" cy="170" r="5" fill="#38bdf8" class="pulse-dot"/><circle cx="850" cy="115" r="4" fill="#818cf8" class="pulse-dot" style="animation-delay:1s"/><circle cx="1050" cy="210" r="5" fill="#c084fc" class="pulse-dot" style="animation-delay:2s"/><g><g transform="translate(60, 0) translate(0, 50)"><rect width="54" height="54" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12"/><path fill="#38bdf8" d="M 27 14 L 12 26 L 16 26 L 16 40 L 38 40 L 38 26 L 42 26 Z M 23 34 L 23 27 L 31 27 L 31 34 Z"/></g><text x="72" y="72" class="banner-tag" transform="translate(60, 0)">CURATED ECOSYSTEM &amp; RESEARCH</text><text x="0" y="145" class="banner-title" filter="url(#glow)" transform="translate(60, 0)">Awesome Mortgage Servicing Platform</text><text x="0" y="145" class="banner-title" transform="translate(60, 0)">Awesome Mortgage Servicing Platform</text><text x="0" y="188" class="banner-subtitle" transform="translate(60, 0)">Enterprise SaaS Products, Open-Source Loan Engines &amp; Servicing Infrastructure</text><g transform="translate(60, 0) translate(0, 215)"><rect width="160" height="28" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="14"/><text x="16" y="18" fill="#93c5fd" font-family="system-ui" font-size="12" font-weight="600">🏦 Loan Servicing</text><rect width="165" height="28" x="172" y="0" fill="#1e293b" stroke="#818cf8" stroke-opacity=".5" stroke-width="1" rx="14"/><text x="188" y="18" fill="#c7d2fe" font-family="system-ui" font-size="12" font-weight="600">📑 Escrow &amp; Accounting</text><rect width="1